name: Buyable review routine

# Researches buyable.json gaps/drifts and writes proposals to the `suggestions` branch for
# human approval in the container editor. See scripts/buyable_review_routine.md + PROPOSALS.md.
#
# Triggered manually from the editor's "Run routine" button (workflow_dispatch), or on its
# own — uncomment the schedule below to run nightly.

on:
  workflow_dispatch:
    inputs:
      window:
        description: "Existing items to re-check for cost changes"
        required: false
        default: "25"
  # schedule:
  #   - cron: "37 3 * * *"   # 03:37 UTC nightly (off-peak / off-minute)

permissions:
  contents: write          # default GITHUB_TOKEN pushes proposals to the suggestions branch

concurrency:
  group: buyable-review     # never let two runs fight over proposals.json
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (master)
        uses: actions/checkout@v5     # v5 runs on Node 24 (v4 triggers the Node 20 deprecation notice)
        with:
          fetch-depth: 0     # need the suggestions branch too

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The worktree MUST live inside the workspace (_suggestions/) — the Claude action only
      # has filesystem access within the checkout, so a sibling ../suggestions is invisible to
      # it (that's why an earlier run wrote nothing).
      - name: Check out suggestions branch in a worktree
        run: |
          git fetch origin suggestions
          git worktree add -B suggestions _suggestions origin/suggestions

      - name: Audit (deterministic candidates)
        run: |
          python scripts/audit_buyables.py \
            --clog-items scripts/clog_items.json \
            --buyable    https://raw.githubusercontent.com/${{ github.repository }}/data/buyable.json \
            --rejections _suggestions/rejections.json \
            --cursor     _suggestions/audit_cursor.json \
            --window     "${{ github.event.inputs.window || '25' }}" \
            --out        candidates.json

      - name: Research candidates and write proposals (Claude)
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pin a current model — the action's default (claude-sonnet-4-20250514) is retired and 404s.
          model: "claude-sonnet-4-6"
          allowed_tools: "Bash,Read,Write,Edit,WebFetch,WebSearch"
          max_turns: "80"
          timeout_minutes: "25"
          prompt: |
            You are the buyable review routine running in CI. Your working directory is the repo
            root. Everything mechanical is already done:
              - `./candidates.json` holds this run's candidates (missing + changed),
              - `./_suggestions/` is a checkout of the suggestions branch with proposals.json,
                rejections.json and buyable-guidelines.md.
            ALL paths below are relative to your working directory (the repo root). Use exactly
            `_suggestions` — do not invent `../suggestions` or absolute paths.

            Steps:
            1. Read ./candidates.json, ./_suggestions/buyable-guidelines.md, and
               ./_suggestions/rejections.json.
            2. For each candidate (process at most 20 — all `changed` first, then `missing`):
               - Verify the cost against the wiki PROSE with WebFetch — storeline numbers are
                 unreliable, so only propose a `changed` correction when the prose disagrees with
                 the stored value. Skip a candidate you can't confirm.
               - Apply every rule in buyable-guidelines.md; keep cost/description terse.
               - WRITE THE PROPOSAL by actually RUNNING this (don't just describe it):
                   python scripts/propose.py --dir _suggestions buyable \
                     --item-id <id> --item-name "<name>" --change new \
                     --entries '[{"approx":false,"cost":"<cost>","description":null,"kind":"currency","rate":null,"sources":["<shop>"]}]' \
                     --revid <revid> --rationale "<why>" --source <wiki URL>
                 Each successful call prints `wrote buyable:<id>`. Confirm you see that line.
            3. Distill recurring scope:"general" rejections into guideline proposals the same way
               (`propose.py --dir _suggestions guideline ...`), if any.

            Do NOT git commit or push — the workflow does that. Just leave _suggestions/proposals.json
            edited. End by printing how many proposals you wrote (buyable + guideline) and what you skipped.

      - name: Commit + push proposals to the suggestions branch
        run: |
          cd _suggestions
          if git diff --quiet && git diff --cached --quiet; then
            echo "No proposal changes to commit — Claude wrote nothing this run."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proposals.json audit_cursor.json
          git commit -m "routine: buyable proposals ($(date -u +%F))"
          git push origin HEAD:suggestions

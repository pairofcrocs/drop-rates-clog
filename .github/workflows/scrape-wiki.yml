name: Refresh wiki-sourced data

# Daily refresh of drop_rates.json from the OSRS wiki. It reads the committed
# scripts/clog_items.json as its item list — that file is now generated from the game
# cache by the "Update collection log items" workflow (scripts/gen_clog_items.py), not
# scraped here. Workflow is a no-op when there's nothing new: it skips the commit step
# if the scraper produces an identical byte-for-byte output, so the commit log stays clean.

on:
  schedule:
    - cron: '17 7 * * *'   # 07:17 UTC daily — off-peak, slightly offset to avoid hourly thundering herds
  workflow_dispatch:        # manual "Run workflow" button in the Actions UI

permissions:
  contents: write

concurrency:
  group: scrape-wiki
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Scrape drop_rates.json
        # --merge-prev (the checked-out file) carries over any item that transiently failed this
        # run, so a flaky wiki query can't silently delete an item's drop data.
        run: |
          python scripts/scrape.py \
            --out src/main/resources/com/dropratesclog/drop_rates.json \
            --clog-items scripts/clog_items.json \
            --merge-prev src/main/resources/com/dropratesclog/drop_rates.json

      - name: Commit if changed
        run: |
          if git diff --quiet src/main/resources/com/dropratesclog/drop_rates.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/com/dropratesclog/drop_rates.json
          git commit -m "data: refresh drop_rates from wiki"
          git push

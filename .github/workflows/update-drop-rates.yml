name: Update drop rates

# The single drop-rates pipeline: scrapes the wiki once and publishes to BOTH
# destinations — the data branch (what running plugins fetch) and the bundled
# resource on master (the jar's offline fallback, refreshed here so plugin
# releases ship current data). The old scrape-wiki.yml daily job is gone; the
# clog item list it also used to scrape now comes from the game cache via
# clog-items.yml, and merging one of those PRs re-triggers this workflow (the
# push path filter below) so new items get rates the same cycle.

on:
  schedule:
    # Wednesdays 14:00 UTC — a few hours after the weekly OSRS game update
    - cron: '0 14 * * 3'
  push:
    branches: [master]
    paths: ['scripts/clog_items.json']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-drop-rates
  cancel-in-progress: false

env:
  # Branch the plugin fetches its JSON from on start-up. Files live at the branch root.
  DATA_BRANCH: data
  DATA_FILE: drop_rates.json
  # Copy bundled into the plugin jar as the offline/startup fallback.
  BUNDLED_FILE: src/main/resources/com/dropratesclog/drop_rates.json
  SCRAPE_OUT: drop_rates.json.new

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch current live data
        run: |
          git fetch origin "$DATA_BRANCH"
          # The currently-published file on the data branch, or empty if the branch
          # doesn't have it yet (first run / fresh branch).
          git show "origin/${DATA_BRANCH}:${DATA_FILE}" > drop_rates.json.cur 2>/dev/null || : > drop_rates.json.cur

      - name: Run scraper
        # --merge-prev carries over any item that transiently failed to scrape this run, so a
        # single flaky wiki query can never silently delete an item's drop data.
        run: python scripts/scrape.py --out "$SCRAPE_OUT" --merge-prev drop_rates.json.cur

      - name: Sanity check
        id: sanity
        continue-on-error: true
        run: python scripts/sanity_check.py drop_rates.json.cur "$SCRAPE_OUT"

      - name: Open issue on sanity failure
        if: steps.sanity.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Drop rates scraper sanity check failed ($(date -u +%F))" \
            --body "The weekly scraper run produced output that failed sanity checks (item count delta >20%, empty result, or invalid JSON). The wiki may have changed schema or be temporarily unavailable. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          exit 1

      - name: Detect changes
        id: diff
        run: |
          if cmp -s drop_rates.json.cur "$SCRAPE_OUT"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to data branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -e
          # Work on the data branch in an isolated worktree so the scrape output and the
          # plugin's working tree don't collide with the data branch's contents.
          git worktree add -B "$DATA_BRANCH" data-wt "origin/${DATA_BRANCH}"
          cp "$SCRAPE_OUT" "data-wt/${DATA_FILE}"

          cd data-wt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DATA_FILE"
          git commit -m "Update drop rates from wiki ($(date -u +%F))"
          git push origin "$DATA_BRANCH"

      - name: Refresh bundled fallback on master
        # Same scrape output, second destination: the resource compiled into the plugin
        # jar. Only used by clients before their async data-branch fetch lands (or when
        # it fails), so freshness here only really matters at plugin-release time.
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -e
          cp "$SCRAPE_OUT" "$BUNDLED_FILE"
          if git diff --quiet "$BUNDLED_FILE"; then
            echo "Bundled copy already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BUNDLED_FILE"
          git commit -m "data: refresh bundled drop_rates fallback ($(date -u +%F))"
          # Master may have moved while we scraped (the checkout is from job start).
          git pull --rebase origin master
          git push origin HEAD:master

name: Update drop rates

# The single drop-rates pipeline: scrapes the wiki once and publishes to BOTH
# destinations — the data branch (what running plugins fetch) and the bundled
# resource on master (the jar's offline fallback, refreshed here so plugin
# releases ship current data). The old scrape-wiki.yml daily job is gone; the
# clog item list it also used to scrape now comes from the game cache via
# clog-items.yml, and merging one of those PRs re-triggers this workflow (the
# push path filter below) so new items get rates the same cycle.

on:
  schedule:
    # Full scrape every 2 days at 14:00 UTC (a few hours after game-update time)
    - cron: '0 14 */2 * *'
    # Gap-fill every 2 hours: re-scrape ONLY items that still have no data, so new
    # items get rates as soon as the wiki documents them. Odd hours so it never
    # fires at the same minute as the full scrape above.
    - cron: '0 1-23/2 * * *'
  push:
    branches: [master]
    paths: ['scripts/clog_items.json']
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = all items, missing = only items with no data yet'
        type: choice
        options: [full, missing]
        default: full

permissions:
  contents: write
  issues: write

concurrency:
  group: update-drop-rates
  cancel-in-progress: false

env:
  # Branch the plugin fetches its JSON from on start-up. Files live at the branch root.
  DATA_BRANCH: data
  DATA_FILE: drop_rates.json
  # Copy bundled into the plugin jar as the offline/startup fallback.
  BUNDLED_FILE: src/main/resources/com/dropratesclog/drop_rates.json
  SCRAPE_OUT: drop_rates.json.new
  # On-Slayer-task rates, generated from the same scrape pass (see scrape.py docstring).
  SLAYER_FILE: slayer_rates.json
  SLAYER_OUT: slayer_rates.json.new

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch current live data
        run: |
          git fetch origin "$DATA_BRANCH"
          # The currently-published files on the data branch, or empty if the branch
          # doesn't have them yet (first run / fresh branch).
          git show "origin/${DATA_BRANCH}:${DATA_FILE}" > drop_rates.json.cur 2>/dev/null || : > drop_rates.json.cur
          git show "origin/${DATA_BRANCH}:${SLAYER_FILE}" > slayer_rates.json.cur 2>/dev/null || : > slayer_rates.json.cur

      - name: Resolve scrape mode
        id: mode
        # missing mode (the 2-hourly schedule, or dispatch with mode=missing) scrapes only
        # items with no published data yet — skipping items covered by the curated
        # buyable/skilling-pets files, which will never have dropsline rows. Everything
        # else (2-daily schedule, clog_items.json push, plain dispatch) is a full scrape.
        run: |
          if { [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 1-23/2 * * *" ]; } \
             || [ "${{ github.event.inputs.mode }}" = "missing" ]; then
            echo "name=missing" >> "$GITHUB_OUTPUT"
            echo "flags=--missing-only --covered src/main/resources/com/dropratesclog/buyable.json --covered src/main/resources/com/dropratesclog/skilling_pets.json" >> "$GITHUB_OUTPUT"
          else
            echo "name=full" >> "$GITHUB_OUTPUT"
            echo "flags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scraper
        # --merge-prev carries over any item that transiently failed to scrape this run, so a
        # single flaky wiki query can never silently delete an item's drop data. The slayer
        # pass reuses the same dropsline rows, so this stays a single wiki sweep.
        run: |
          python scripts/scrape.py --out "$SCRAPE_OUT" --merge-prev drop_rates.json.cur \
            --slayer-out "$SLAYER_OUT" --slayer-merge-prev slayer_rates.json.cur \
            ${{ steps.mode.outputs.flags }}

      - name: Sanity check
        id: sanity
        continue-on-error: true
        run: python scripts/sanity_check.py drop_rates.json.cur "$SCRAPE_OUT"

      - name: Open issue on sanity failure
        if: steps.sanity.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Drop rates scraper sanity check failed ($(date -u +%F))" \
            --body "A scraper run produced output that failed sanity checks (item count delta >20%, empty result, or invalid JSON). The wiki may have changed schema or be temporarily unavailable. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          exit 1

      - name: Detect changes
        id: diff
        run: |
          if cmp -s drop_rates.json.cur "$SCRAPE_OUT" && cmp -s slayer_rates.json.cur "$SLAYER_OUT"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to data branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -e
          # Work on the data branch in an isolated worktree so the scrape output and the
          # plugin's working tree don't collide with the data branch's contents.
          git worktree add -B "$DATA_BRANCH" data-wt "origin/${DATA_BRANCH}"
          cp "$SCRAPE_OUT" "data-wt/${DATA_FILE}"
          cp "$SLAYER_OUT" "data-wt/${SLAYER_FILE}"

          cd data-wt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DATA_FILE" "$SLAYER_FILE"
          git commit -m "Update drop rates from wiki ($(date -u +%F), ${{ steps.mode.outputs.name }} scrape)"
          git push origin "$DATA_BRANCH"

      - name: Refresh bundled fallback on master
        # Same scrape output, second destination: the resource compiled into the plugin
        # jar. Only used by clients before their async data-branch fetch lands (or when
        # it fails), so freshness here only really matters at plugin-release time.
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -e
          cp "$SCRAPE_OUT" "$BUNDLED_FILE"
          if git diff --quiet "$BUNDLED_FILE"; then
            echo "Bundled copy already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BUNDLED_FILE"
          git commit -m "data: refresh bundled drop_rates fallback ($(date -u +%F))"
          # Master may have moved while we scraped (the checkout is from job start).
          git pull --rebase origin master
          git push origin HEAD:master
